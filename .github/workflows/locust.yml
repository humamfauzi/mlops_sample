name: Load Test

on:
  workflow_dispatch:  # Manual trigger

jobs:
  locust_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install locust

    # Verify the target is actually being served before generating traffic.
    # Without this the run can "pass" against a 404 and report a green build.
    - name: Preflight - confirm model is served
      env:
        LOCUST_HOST: ${{ secrets.HOST }}
      run: |
        set -euo pipefail
        curl -sS --fail --max-time 15 "$LOCUST_HOST/cfs2017" -o /tmp/models.json
        echo "Published models:"; cat /tmp/models.json; echo
        python - <<'PY'
        import json, os, pathlib, sys
        target = json.loads(pathlib.Path("loadtest/target.json").read_text())
        served = {m["main_id"] for m in json.loads(
            pathlib.Path("/tmp/models.json").read_text()).get("data", [])}
        if target["model"] not in served:
            sys.exit(f"load test targets '{target['model']}' but server exposes {sorted(served)}")
        print(f"OK: '{target['model']}' is served")
        PY

    # No continue-on-error: a load test that cannot be trusted to fail is not a test.
    - name: Run Locust
      env:
        LOCUST_HOST: ${{ secrets.HOST }}
      run: |
        locust -f loadtest/locust.py --headless --host=$LOCUST_HOST \
          --users 10 --spawn-rate 2 --run-time 1m \
          --only-summary --html=locust_report.html

    - name: Upload Locust report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: locust-report
        path: locust_report.html
