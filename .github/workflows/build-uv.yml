name: Build and Verify Executable

# The deployed artifact is a PyInstaller binary, not a container image. Building
# on every push to main is what keeps dist/ from silently drifting behind the
# source -- a stale server binary once shipped with a storage backend it did not
# understand, and nothing in the repository could detect it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to build with'
        required: false
        default: '3.10'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so tools/stamp_build.py can resolve the real SHA.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ inputs.python_version || '3.10' }}

      - name: Install dependencies
        # --frozen: build exactly what uv.lock pins, never re-resolve.
        run: uv sync --frozen

      - name: Stamp build provenance
        run: uv run python tools/stamp_build.py

      - name: Build train_module
        run: |
          uv run pyinstaller --onefile --name train_module \
            --distpath ./dist --clean train/main.py

      - name: Build server_module
        run: |
          uv run pyinstaller --onefile --name server_module \
            --distpath ./dist --clean \
            --hidden-import=sklearn.ensemble \
            --hidden-import=train.wrapper \
            server/launcher.py

      - name: Verify train_module boots and reports provenance
        run: |
          ./dist/train_module --version
          ./dist/train_module --instruction_list

      - name: Smoke test server_module
        run: ./scripts/smoke_test.sh ./dist/server_module "$(git rev-parse HEAD)"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: mlops-binaries-${{ github.sha }}
          path: |
            dist/train_module
            dist/server_module
          retention-days: 30
          if-no-files-found: error
