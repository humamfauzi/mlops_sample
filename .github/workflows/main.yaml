name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      # Dependencies come from uv.lock, not from a prebuilt third-party image.
      # The previous setup pulled humamf/dsmlflow:stable, an image this
      # repository no longer builds, so the toolchain was unreproducible.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest --disable-warnings --ignore=pgdata -vv
