[project]
name = "mlops-sample"
version = "0.1.0"
description = "CFS 2017 shipment value prediction - training pipeline and inference server"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.117.1",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.2",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=8.4.2",
]

# The deployed artifact is a PyInstaller binary (see tools/stamp_build.py and
# .github/workflows/), but the project is still installable so that CI and
# local development can resolve it as a normal package.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "train",
    "server",
    "repositories",
    "column",
    "config",
    "buildinfo.py",
    "runtime_config.py",
]

# Keep the sdist deterministic. Without this, hatchling walks the working tree
# and can sweep in local caches, virtualenvs and databases.
[tool.hatch.build.targets.sdist]
only-include = [
    "train",
    "server",
    "repositories",
    "column",
    "scripts",
    "tools",
    "deploy",
    "train_config",
    "config",
    "loadtest",
    "buildinfo.py",
    "runtime_config.py",
    "pyproject.toml",
    "README.md",
    "Makefile",
]
